	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta property="og:title" content="الأعمال — أحمد خالد توفيق">

	<meta name="twitter:title" content="الأعمال — أحمد خالد توفيق">

	<link rel="stylesheet" href="assets/css/fonts.css">
	<link rel="stylesheet" href="assets/css/site.css">
	<link rel="stylesheet" href="assets/css/lists.css">
	<link rel="stylesheet" href="assets/css/notify.css">
	<link rel="stylesheet" href="assets/css/extras.css">
	<link rel="stylesheet" href="assets/css/books.css">
	<link rel="stylesheet" href="assets/css/detail.css">
	<link rel="stylesheet" href="assets/css/shelf-hero.css">
	<script>try{var h=document.documentElement,l=localStorage.getItem('akt-lang'),t=localStorage.getItem('akt-theme');if(l==='en'){h.lang='en';h.dir='ltr';}if(t==='light'||(!t&&matchMedia('(prefers-color-scheme: light)').matches))h.setAttribute('data-theme','light');}catch(e){}</script>
</head>
<body>
	<header id="site-header"></header>

	<main id="main">
		<!-- bookshelf hero: hover a book to bring it forward and read about it -->
		<section class="shelf-hero" id="shelf-hero"></section>

		<section class="page-hero">
			<div class="wrap">
				<p class="eyebrow" data-i18n="eyebrow"></p>
				<h1 data-i18n="title"></h1>
				<p class="lead" data-i18n="lead"></p>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head"><div><h2 data-i18n="seriesTitle"></h2><p data-i18n="seriesHint"></p></div></div>
				<ul class="bk-list" id="series"></ul>
			</div>
		</section>

		<section class="section" id="contrib-section" hidden>
			<div class="wrap">
				<div class="section-head"><div><h2 data-i18n="contribTitle"></h2><p data-i18n="contribHint"></p></div></div>
				<div class="cover-row" id="contrib"></div>
			</div>
		</section>

		<section class="section" id="issues-section" hidden>
			<div class="wrap">
				<div class="section-head">
					<div><h2 data-i18n="issuesTitle"></h2><p data-i18n="issuesHint"></p></div>
					<div class="chips issues-tabs" id="issue-tabs" role="group"></div>
				</div>
				<div class="issues" id="issues"></div>
				<div class="issue-card"><div class="shelf-card" id="issue-card" aria-live="polite" hidden></div></div>
				<p class="issues-note" id="issues-note"></p>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head">
					<div><h2 data-i18n="booksTitle"></h2><p data-i18n="booksHint"></p></div>
					<div class="chips" id="filters" role="group"></div>
				</div>
				<ul class="hc-grid" id="books"></ul>
			</div>
		</section>

		<section class="section" id="adaptations-section">
			<div class="wrap">
				<div class="section-head"><div><h2 data-i18n="adaptTitle"></h2><p data-i18n="adaptHint"></p></div></div>
				<div class="adapt-grid" id="adaptations"></div>
			</div>
		</section>
	</main>

	<footer id="site-footer"></footer>

	<script src="assets/js/data.js"></script>
	<script src="assets/js/data-issues.js"></script>
	<script src="assets/js/data-quotes.js"></script>
	<script src="assets/js/data-legacy.js"></script>
	<script src="assets/js/data-books-a.js"></script>
	<script src="assets/js/data-books-b.js"></script>
	<script src="assets/js/data-series-more.js"></script>
	<script src="assets/js/data-audio.js"></script>
	<script src="assets/js/data-tributes.js"></script>
	<script src="assets/js/data-more.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
	<script src="https://unpkg.com/split-type@0.3.4/umd/index.min.js"></script>
	<script src="assets/js/books.js"></script>
	<script src="assets/js/shared.js"></script>
	<script src="assets/js/shelf-hero.js"></script>
	<script src="assets/js/works.js"></script>
	<script src="assets/js/notify.js"></script>
	<script src="assets/js/lists.js"></script>
	<script src="assets/js/app.js"></script>
</body>
</html>
