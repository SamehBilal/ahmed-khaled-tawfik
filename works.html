<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>الأعمال — أحمد خالد توفيق</title>
	<meta name="description" content="Every series, novel, collection and translation by Ahmed Khaled Tawfik, as 3D books.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lalezar&family=Noto+Naskh+Arabic:wght@400;600&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/site.css">
	<link rel="stylesheet" href="assets/css/books.css">
	<script>try{if(localStorage.getItem('akt-lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script>
</head>
<body>
	<header id="site-header"></header>

	<main id="main">
		<section class="page-hero">
			<div class="wrap">
				<p class="eyebrow" data-i18n="eyebrow"></p>
				<h1 data-i18n="title"></h1>
				<p class="lead" data-i18n="lead"></p>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head"><div><h2 data-i18n="seriesTitle"></h2><p data-i18n="seriesHint"></p></div></div>
				<ul class="bk-list" id="series"></ul>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head">
					<div><h2 data-i18n="booksTitle"></h2><p data-i18n="booksHint"></p></div>
					<div class="chips" id="filters" role="group"></div>
				</div>
				<ul class="hc-grid" id="books"></ul>
			</div>
		</section>

		<section class="section" id="adaptations-section">
			<div class="wrap">
				<div class="section-head"><div><h2 data-i18n="adaptTitle"></h2><p data-i18n="adaptHint"></p></div></div>
				<div class="adapt-grid" id="adaptations"></div>
			</div>
		</section>
	</main>

	<footer id="site-footer"></footer>

	<script src="assets/js/data.js"></script>
	<script src="assets/js/books.js"></script>
	<script src="assets/js/shared.js"></script>
	<script src="assets/js/works.js"></script>
	<script src="assets/js/app.js"></script>
</body>
</html>
