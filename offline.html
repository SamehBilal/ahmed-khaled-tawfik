<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>دون اتصال — العرّاب</title>
	<meta name="robots" content="noindex">
	<link rel="icon" href="favicon.ico" sizes="32x32 48x48">
	<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png" sizes="180x180">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#0e0f13">
	<meta name="color-scheme" content="dark light">
	<meta name="application-name" content="العرّاب">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="العرّاب">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="msapplication-TileColor" content="#0e0f13">
	<meta name="msapplication-TileImage" content="assets/img/icons/icon-192.png">
	<link rel="stylesheet" href="assets/css/fonts.css">
	<style>
		:root { --ink: #0e0f13; --paper: #efe6d2; --dim: #b9b1a0; --ember: #e0703a; --red: #b3261e; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--ink); color: var(--paper);
			font-family: 'Noto Naskh Arabic', serif; text-align: center; }
		.moon { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 28px; background: radial-gradient(circle at 35% 35%, var(--ember) 0 18%, var(--red) 19%);
			box-shadow: 0 0 60px rgba(179, 38, 30, .45); animation: glow 4s ease-in-out infinite alternate; }
		@keyframes glow { to { box-shadow: 0 0 90px rgba(179, 38, 30, .7); } }
		h1 { font-family: 'Lalezar', 'Reem Kufi', sans-serif; font-weight: 400; font-size: 40px; margin: 0 0 10px; }
		p { color: var(--dim); max-width: 34rem; margin: 0 auto 8px; line-height: 1.8; }
		.en { font-family: 'Cormorant Garamond', serif; font-size: 18px; direction: ltr; }
		.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
		a, button { font: inherit; font-family: 'Reem Kufi', sans-serif; border-radius: 999px; padding: 10px 22px; cursor: pointer; text-decoration: none; }
		button { background: var(--paper); color: var(--ink); border: 0; }
		a { color: var(--paper); border: 1px solid rgba(239, 230, 210, .3); }
		@media (prefers-reduced-motion: reduce) { .moon { animation: none; } }
	</style>
</head>
<body>
	<main>
		<div class="moon" aria-hidden="true"></div>
		<h1>لا يوجد اتصال</h1>
		<p>هذه الصفحة لم تُحفظ بعد على جهازك. الصفحات التي فتحتها من قبل تعمل دون إنترنت.</p>
		<p class="en">You're offline, and this page hasn't been saved on this device yet. Pages you've opened before still work.</p>
		<div class="btns">
			<button type="button" onclick="location.reload()">حاول مجددًا · Retry</button>
			<a href="index.html">الرئيسية · Home</a>
		</div>
	</main>
</body>
</html>
