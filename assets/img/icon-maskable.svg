<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- The app icon: a blood moon over the bare tree of the footer, a bat crossing it. Shapes only, so it scales to any size. -->
	<defs>
		<radialGradient id="sky" cx="62%" cy="30%" r="85%">
			<stop offset="0" stop-color="#2a1416"/>
			<stop offset=".55" stop-color="#110d12"/>
			<stop offset="1" stop-color="#07080b"/>
		</radialGradient>
		<radialGradient id="moon" cx="40%" cy="36%" r="70%">
			<stop offset="0" stop-color="#ffd98a"/>
			<stop offset=".45" stop-color="#ee8a2e"/>
			<stop offset="1" stop-color="#b3261e"/>
		</radialGradient>
		<radialGradient id="glow" cx="50%" cy="50%" r="50%">
			<stop offset=".55" stop-color="#e0703a" stop-opacity=".45"/>
			<stop offset="1" stop-color="#e0703a" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="tile"><rect width="512" height="512"/></clipPath>
	</defs>
	<g clip-path="url(#tile)">
	<rect width="512" height="512" fill="url(#sky)"/><g transform="translate(51.2 51.2) scale(.8)">
	<g fill="#f6e6c4" opacity=".75">
		<circle cx="92" cy="96" r="3"/><circle cx="150" cy="58" r="2"/><circle cx="64" cy="190" r="2.2"/><circle cx="440" cy="300" r="2.4"/><circle cx="214" cy="120" r="1.8"/>
	</g>
	<circle cx="304" cy="206" r="178" fill="url(#glow)"/>
	<circle cx="304" cy="206" r="122" fill="url(#moon)"/>
	<g fill="#b3261e" opacity=".18"><circle cx="262" cy="176" r="18"/><circle cx="338" cy="248" r="26"/><circle cx="350" cy="160" r="11"/></g>
	<!-- the bare tree -->
	<g fill="none" stroke="#050507" stroke-linecap="round" transform="translate(28 120) scale(1.62)">
		<path d="M100 230C99 196 104 162 96 128" stroke-width="13"/>
		<path d="M97 148C80 128 58 122 36 96" stroke-width="6"/>
		<path d="M58 120C48 108 50 92 42 76" stroke-width="3.5"/>
		<path d="M98 132C116 106 142 100 164 74" stroke-width="6"/>
		<path d="M142 98C152 86 168 86 186 80" stroke-width="3.5"/>
		<path d="M96 128C95 96 101 66 92 34" stroke-width="5"/>
		<path d="M94 76C80 66 74 50 68 34" stroke-width="3"/>
		<path d="M97 64C110 54 118 38 126 22" stroke-width="3"/>
		<path d="M40 98C30 94 22 96 12 90" stroke-width="2.5"/>
		<path d="M164 74C168 60 176 54 182 44" stroke-width="2.5"/>
	</g>
	<!-- a bat over the moon -->
	<path fill="#050507" transform="translate(330 112) scale(3.4)" d="M10 4C8 1 5 0 0 2c3 1 3 3 2 5 2-1 4-1 5 1 1-2 2-2 3-1 1-1 2-1 3 1 1-2 3-2 5-1-1-2-1-4 2-5-5-2-8-1-10 2Z"/>
	<!-- hill -->
	<path fill="#050507" d="M-64 430C90 404 170 398 256 410S420 440 576 420V576H-64Z"/>
	</g></g>
	<rect width="0" height="0" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
</svg>
