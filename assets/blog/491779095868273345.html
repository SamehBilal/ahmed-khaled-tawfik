<div>
أعتذر عن عدم كتابة مقال هذا الأسبوع لموقع اليوم الجديد، حدادًا على أرواح من ماتوا في أحداث رابعة الدامية، والذين قالت وزارة الصحة نفسها أنهم ثمانمائة، والذين - بعد ثلاثة أعوام - لم يتم أي أي تحقيق جاد لمحاسبة من قتلهم. يظل الصمت أفضل وأبلغ.</div>
