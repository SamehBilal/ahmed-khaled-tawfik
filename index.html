<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>أحمد خالد توفيق — العرّاب</title>
	<meta name="description" content="Ahmed Khaled Tawfik — a discography: his life, his series and novels, his characters, and the writers around him.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lalezar&family=Noto+Naskh+Arabic:wght@400;600&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/site.css">
	<link rel="stylesheet" href="assets/css/books.css">
	<script>try{if(localStorage.getItem('akt-lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}</script>
</head>
<body>

	<!-- Opening reveal (adapted from "Believe") -->
	<div class="intro" id="intro" aria-hidden="true">
		<svg id="introSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
			<defs>
				<filter id="glow" x="-100%" y="-100%" width="250%" height="250%">
					<feGaussianBlur stdDeviation="4" result="coloredBlur" />
					<feOffset dx="0" dy="0" result="offsetblur"></feOffset>
					<feFlood flood-color="#0b0c0f" flood-opacity="0.45"></feFlood>
					<feComposite in2="offsetblur" operator="in"></feComposite>
					<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
				</filter>
				<mask id="ringMask"><use href="#introText" fill="#fff" /></mask>
				<g id="ringGroup">
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
					<circle class="ring" cx="400" cy="118" r="0" opacity="0"/>
				</g>
			</defs>
			<g fill="#efe6d2">
			<g id="introText">
				<g id="iDot" data-o="400 140"><circle id="iDotShape" cx="400" cy="118" r="22" /></g>
				<g id="iWord" data-o="400 300"><text x="400" y="300" text-anchor="middle" font-family="Lalezar, 'Reem Kufi', sans-serif" font-size="170">العرّاب</text></g>
				<g id="iName">
					<g data-o="590 395"><g class="w" data-o="590 420"><text x="590" y="420" text-anchor="middle" font-family="Lalezar, 'Reem Kufi', sans-serif" font-size="80">أحمد</text></g></g>
					<g data-o="405 395"><g class="w" data-o="405 420"><text x="405" y="420" text-anchor="middle" font-family="Lalezar, 'Reem Kufi', sans-serif" font-size="80">خالد</text></g></g>
					<g data-o="215 395"><g class="w" data-o="215 420"><text x="215" y="420" text-anchor="middle" font-family="Lalezar, 'Reem Kufi', sans-serif" font-size="80">توفيق</text></g></g>
				</g>
			</g>
			</g>
			<g mask="url(#ringMask)">
				<rect width="100%" height="100%" fill="#efe6d2" />
				<use href="#ringGroup" />
			</g>
			<g id="iMotto">
				<text x="400" y="505" text-anchor="middle" fill="#b9b1a0" font-family="'Reem Kufi', sans-serif" font-size="34">اجعلهم يقرؤون</text>
				<text x="400" y="545" text-anchor="middle" fill="#8a8577" font-family="'Cormorant Garamond', serif" font-size="18" letter-spacing="6">MAKE THEM READ</text>
			</g>
		</svg>
		<button class="intro-skip" type="button">Skip</button>
	</div>

	<header id="site-header"></header>

	<main id="main">
		<section class="home-hero">
			<div class="wrap">
				<div id="hero-text"></div>
				<div class="hero-stage"><ul class="bk-list" id="hero-book"></ul></div>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head"><div><p class="eyebrow" data-i18n="bioEyebrow"></p><h2 data-i18n="bioTitle"></h2></div></div>
				<div class="bio rise" id="bio"></div>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head"><div><p class="eyebrow" data-i18n="lifeEyebrow"></p><h2 data-i18n="lifeTitle"></h2></div></div>
				<ol class="timeline" id="timeline"></ol>
			</div>
		</section>

		<section class="section">
			<div class="wrap">
				<div class="section-head"><div><p class="eyebrow" data-i18n="exploreEyebrow"></p><h2 data-i18n="exploreTitle"></h2></div></div>
				<div class="explore" id="explore"></div>
			</div>
		</section>
	</main>

	<footer id="site-footer"></footer>

	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomWiggle.min.js"></script>
	<script src="assets/js/data.js"></script>
	<script src="assets/js/books.js"></script>
	<script src="assets/js/shared.js"></script>
	<script src="assets/js/home.js"></script>
	<script src="assets/js/app.js"></script>
	<script src="assets/js/intro.js"></script>
</body>
</html>
